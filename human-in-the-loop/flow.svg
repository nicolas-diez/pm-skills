<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 360" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="t">From a request to a deck or a PRD, with the person deciding at every step</title>
  <desc id="d">A request goes through four questions that turn it into an outcome, then a workshop on a Miro board where the AI drafts each frame and the person decides it, then a deck to convince or a short PRD to build, both made from those decisions. The board can also be the final deliverable.</desc>
  <rect width="980" height="360" rx="14" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#57606a"/>
    </marker>
  </defs>

  <!-- request -->
  <rect x="24" y="96" width="150" height="96" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="99" y="134" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2328">A request</text>
  <text x="99" y="156" text-anchor="middle" font-size="12.5" fill="#57606a">"We need a</text>
  <text x="99" y="173" text-anchor="middle" font-size="12.5" fill="#57606a">dashboard"</text>
  <line x1="174" y1="144" x2="212" y2="144" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- outcome pass -->
  <rect x="216" y="80" width="200" height="128" rx="10" fill="#ffffff" stroke="#57606a"/>
  <text x="316" y="108" text-anchor="middle" font-size="11" letter-spacing="1" fill="#57606a">STEP 1</text>
  <text x="316" y="134" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2328">ship-outcomes</text>
  <text x="316" y="158" text-anchor="middle" font-size="12.5" fill="#57606a">Four questions turn the</text>
  <text x="316" y="175" text-anchor="middle" font-size="12.5" fill="#57606a">request into a goal</text>
  <text x="316" y="196" text-anchor="middle" font-size="12" fill="#0969da">one page</text>
  <line x1="416" y1="144" x2="454" y2="144" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- workshop -->
  <rect x="458" y="64" width="232" height="160" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="574" y="92" text-anchor="middle" font-size="11" letter-spacing="1" fill="#0969da">STEP 2</text>
  <text x="574" y="118" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2328">product-workshop</text>
  <text x="574" y="142" text-anchor="middle" font-size="12.5" fill="#1f2328">The AI drafts seven frames.</text>
  <text x="574" y="159" text-anchor="middle" font-size="12.5" fill="#1f2328">You decide them one at a time.</text>
  <text x="574" y="183" text-anchor="middle" font-size="12" fill="#0969da">board + decision log</text>
  <text x="574" y="207" text-anchor="middle" font-size="11.5" fill="#57606a">goal · customer · failure · ideas · metrics</text>
  <line x1="690" y1="124" x2="728" y2="102" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="690" y1="164" x2="728" y2="186" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- deck -->
  <rect x="732" y="58" width="224" height="82" rx="10" fill="#ffffff" stroke="#57606a"/>
  <text x="844" y="78" text-anchor="middle" font-size="11" letter-spacing="1" fill="#57606a">STEP 3 · TO CONVINCE</text>
  <text x="844" y="101" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2328">workshop-to-deck</text>
  <text x="844" y="123" text-anchor="middle" font-size="12" fill="#0969da">deck + PDF</text>

  <!-- prd -->
  <rect x="732" y="150" width="224" height="82" rx="10" fill="#ffffff" stroke="#57606a"/>
  <text x="844" y="170" text-anchor="middle" font-size="11" letter-spacing="1" fill="#57606a">STEP 3 · TO BUILD</text>
  <text x="844" y="193" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2328">workshop-to-prd</text>
  <text x="844" y="215" text-anchor="middle" font-size="12" fill="#0969da">short PRD that starts from the test</text>

  <!-- the person in the loop -->
  <line x1="216" y1="262" x2="956" y2="262" stroke="#bf8700" stroke-width="2"/>
  <circle cx="316" cy="262" r="6" fill="#bf8700"/>
  <circle cx="574" cy="262" r="6" fill="#bf8700"/>
  <circle cx="844" cy="262" r="6" fill="#bf8700"/>
  <line x1="316" y1="208" x2="316" y2="256" stroke="#bf8700" stroke-width="1.2" stroke-dasharray="3 3"/>
  <line x1="574" y1="224" x2="574" y2="256" stroke="#bf8700" stroke-width="1.2" stroke-dasharray="3 3"/>
  <line x1="844" y1="232" x2="844" y2="256" stroke="#bf8700" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text x="24" y="267" font-size="13" font-weight="600" fill="#7d4e00">You, in the loop</text>
  <text x="316" y="290" text-anchor="middle" font-size="12" fill="#57606a">answer four questions</text>
  <text x="574" y="290" text-anchor="middle" font-size="12" fill="#57606a">decide every frame</text>
  <text x="844" y="290" text-anchor="middle" font-size="12" fill="#57606a">approve slides, decide scope</text>

  <text x="490" y="334" text-anchor="middle" font-size="12.5" fill="#57606a">In steps 2 and 3 the code refuses to move forward without your answer. The board can also be the final deliverable.</text>
  <text x="490" y="36" text-anchor="middle" font-size="17" font-weight="600" fill="#1f2328">From a request to a deck or a PRD, with you deciding at every step</text>
</svg>
